<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metrificale</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>
<body>
    <header>
        <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
        <a href="{{ url_for('help_page') }}" class="help-icon">?</a>
    </header>
    <div class="container">
        <div class="pane left">
            <textarea id="input-text" placeholder="Wpisz tekst..."></textarea>
            <button id="analyze-btn">Analizuj</button>
        </div>
        <div class="pane right">
            <div id="loader" class="hidden"></div> <div id="result"></div>
        </div>
    </div>
    <script>

    function adjustFontSize() {
        const pane  = document.querySelector('.right');
        const table = pane.querySelector('table');
        if (!table) return;

        table.style.fontSize = '';
        
        let fontSize = parseInt(window.getComputedStyle(table).fontSize);
        
        while (table.scrollWidth > pane.clientWidth && fontSize > 8) {
            fontSize--;
            table.style.fontSize = fontSize + 'px';
        }
    }

    $(document).ready(function() {
        $('#analyze-btn').click(function() {
            const text = $('#input-text').val();
            if (text.trim() === "") {
                $('#result').html('<p style="color: orange;">Proszę wpisać tekst do analizy.</p>');
                return;
            }
            $('#result').empty();
            $('#loader').removeClass('hidden');

            $.ajax({
                url: '/analyze',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ text: text }),
                success: function(response) {
                    $('#loader').addClass('hidden'); 
                    $('#result').html(response.html); 
                    adjustFontSize(); 
                },
                error: function(jqXHR, textStatus, errorThrown) { 
                    $('#loader').addClass('hidden');
                    let errorMsg = 'Wystąpił błąd serwera.';
                    if (jqXHR.responseJSON && jqXHR.responseJSON.html) {
                        errorMsg = jqXHR.responseJSON.html; 
                    } else if (jqXHR.responseText) {
                        errorMsg = `<p>Błąd: ${jqXHR.status} ${errorThrown}</p><pre>${jqXHR.responseText.substring(0, 500)}</pre>`;
                    }
                    $('#result').html(`<div style="color: red;">${errorMsg}</div>`);
                }
            });
        });

        let resizeTimeout;
        $(window).on('resize', function() {
            clearTimeout(resizeTimeout);
            resizeTimeout = setTimeout(adjustFontSize, 250);
        });
    });
    </script>
    <footer class="footer">
        <div class="footer-text">Autor: Tytus Dunin, Wydział Polonistyki Uniwersytetu Warszawskiego 2026 | <strong>wersja 1.1.0</strong></div>
    </footer>
</body>
</html>
